components:
  schemas:
    AcademicProgram:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        description:
          type: string
      required:
      - id
      - name
    Achievement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        achievement_date:
          type: string
          format: date
        cover_image:
          type: string
          format: uri
          nullable: true
      required:
      - achievement_date
      - id
      - title
    AdminAdmissionActionRequestActionEnum:
      enum:
      - advance
      - reject
      type: string
      description: |-
        * `advance` - advance
        * `reject` - reject
    AdminAdmissionActionRequestRequest:
      type: object
      properties:
        action:
          allOf:
          - $ref: '#/components/schemas/AdminAdmissionActionRequestActionEnum'
          description: |-
            'advance' moves the application forward; 'reject' refuses it.

            * `advance` - advance
            * `reject` - reject
        reason:
          type: string
          minLength: 1
          description: Rejection reason (required when action='reject').
      required:
      - action
    AdminAdmissionActionResponse:
      type: object
      properties:
        credentials:
          $ref: '#/components/schemas/AdminCredentialsPayload'
        status:
          type: string
      required:
      - credentials
      - status
    AdminAdmissionCreateRequestRequest:
      type: object
      properties:
        applicant_name:
          type: string
          minLength: 1
          description: Full name of the applicant.
        date_of_birth:
          type: string
          format: date
        gender:
          allOf:
          - $ref: '#/components/schemas/GenderEnum'
          default: Male
        target_class:
          type: string
          minLength: 1
        parent_name:
          type: string
          minLength: 1
        parent_phone:
          type: string
          minLength: 1
        parent_email:
          type: string
          format: email
          minLength: 1
        address:
          type: string
          minLength: 1
          default: ''
        scholarship_applied:
          type: boolean
          default: false
      required:
      - applicant_name
      - target_class
    AdminAdmissionCreateResponse:
      type: object
      properties:
        detail:
          type: string
        registration_number:
          type: string
      required:
      - detail
      - registration_number
    AdminAdmissionListItem:
      type: object
      properties:
        registration_number:
          type: string
        applicant_name:
          type: string
        date_of_birth:
          type: string
          format: date
        gender:
          type: string
        target_class:
          type: string
        parent_name:
          type: string
        parent_phone:
          type: string
        parent_email:
          type: string
          format: email
        scholarship_applied:
          type: boolean
        status:
          type: string
        rejection_reason:
          type: string
        submitted_at:
          type: string
          format: date-time
    AdminAssignedSubject:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    AdminAuditLogItem:
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        details: {}
        created_at:
          type: string
          format: date-time
        actor_name:
          type: string
    AdminBackupExportResponse:
      type: object
      properties:
        generated_at:
          type: string
          format: date
        tables:
          type: object
          additionalProperties: {}
    AdminBookCreateRequestRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        author:
          type: string
          minLength: 1
        isbn:
          type: string
          minLength: 1
        barcode_id:
          type: string
          minLength: 1
        quantity:
          type: integer
        available_quantity:
          type: integer
        book_type:
          type: string
          minLength: 1
        digital_file_url:
          type: string
          format: uri
          minLength: 1
      required:
      - title
    AdminBookItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        isbn:
          type: string
        barcode_id:
          type: string
        quantity:
          type: integer
        available_quantity:
          type: integer
        book_type:
          type: string
        digital_file_url:
          type: string
          format: uri
    AdminClassCreateRequestRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        section:
          type: string
          minLength: 1
        curriculum:
          type: string
          minLength: 1
        room_number:
          type: string
          minLength: 1
      required:
      - name
      - section
    AdminClassItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        section:
          type: string
        curriculum:
          type: string
        room_number:
          type: string
    AdminClassTeacherAssignRequestRequest:
      type: object
      properties:
        class_id:
          type: integer
        teacher_id:
          type: integer
        subject_id:
          type: integer
      required:
      - class_id
      - teacher_id
    AdminClassTeacherAssignResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    AdminClassTeacherListItem:
      type: object
      properties:
        class_id:
          type: integer
        class_name:
          type: string
        teacher_id:
          type: integer
        teacher_name:
          type: string
        assigned_subjects:
          type: array
          items:
            $ref: '#/components/schemas/AdminAssignedSubject'
    AdminCredentialsPayload:
      type: object
      properties:
        student_username:
          type: string
        student_temp_password:
          type: string
        parent_username:
          type: string
        parent_temp_password:
          type: string
        parent_account_reused:
          type: boolean
      required:
      - parent_username
      - student_temp_password
      - student_username
    AdminDashboardResponse:
      type: object
      properties:
        pending_admissions:
          type: integer
        total_students:
          type: integer
        total_teachers:
          type: integer
        total_parents:
          type: integer
        total_employees:
          type: integer
        open_leaves:
          type: integer
        fee_collected_this_month:
          type: number
          format: double
        library_books_out:
          type: integer
        recent_admissions:
          type: array
          items:
            $ref: '#/components/schemas/AdminRecentAdmissionItem'
    AdminEnrollmentCreateRequestRequest:
      type: object
      properties:
        student_id:
          type: integer
        class_id:
          type: integer
        roll_number:
          type: integer
        academic_year:
          type: string
          minLength: 1
          default: 2025-26
      required:
      - class_id
      - student_id
    AdminEnrollmentCreateResponse:
      type: object
      properties:
        id:
          type: integer
        detail:
          type: string
      required:
      - detail
      - id
    AdminEnrollmentListItem:
      type: object
      properties:
        id:
          type: integer
        student_id:
          type: integer
        student_username:
          type: string
        student_name:
          type: string
        class_id:
          type: integer
        class_name:
          type: string
        academic_year:
          type: string
        roll_number:
          type: integer
    AdminFeeStructureCreateRequestRequest:
      type: object
      properties:
        class_id:
          type: integer
        term_name:
          type: string
          minLength: 1
        tuition_fee:
          type: number
          format: double
        transport_fee:
          type: number
          format: double
        hostel_fee:
          type: number
          format: double
        total_amount:
          type: number
          format: double
      required:
      - class_id
      - term_name
    AdminFeeStructureItem:
      type: object
      properties:
        id:
          type: integer
        class_id:
          type: integer
        term_name:
          type: string
        tuition_fee:
          type: number
          format: double
        transport_fee:
          type: number
          format: double
        hostel_fee:
          type: number
          format: double
        total_amount:
          type: number
          format: double
    AdminLeaveDecideRequestRequest:
      type: object
      properties:
        decision:
          allOf:
          - $ref: '#/components/schemas/DecisionEnum'
          description: |-
            Decision to apply to the leave request.

            * `Approved` - Approved
            * `Rejected` - Rejected
      required:
      - decision
    AdminLeaveDecideResponse:
      type: object
      properties:
