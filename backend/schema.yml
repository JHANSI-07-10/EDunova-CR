openapi: 3.0.3
info:
  title: EduNova Global Academy API
  version: 1.0.0
  description: |-
    Integrated API for EduNova Global Academy. Covers the public website (CMS + admissions enquiries), the student, teacher and parent portals, and the admin portal (admissions, academics, library, hostel, transport, timetable, finance, payroll, scholarship, reports and system modules).

    Authentication uses the OTP login flow: call `auth/login` with your credentials to receive a one-time password, then `auth/verify-otp` to obtain JWT access and refresh tokens. Click **Authorize** and paste your Bearer access token to call protected endpoints.
paths:
  /api/admin-portal/admissions/:
    get:
      operationId: AdminAdmissionList
      description: Returns admission applications, optionally filtered by status.
        Ordered by most recent submission.
      summary: List admission applications
      parameters:
      - in: query
        name: status
        schema:
          type: string
        description: Filter by application status (e.g. Registered, Verification,
          Screening, Fee_Pending, Confirmed, Rejected).
      tags:
      - Admissions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminAdmissionListItem'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailErrorResponse'
          description: ''
    post:
      operationId: AdminAdmissionCreate
      description: Creates a new admission application in the 'Registered' status
        with an auto-generated registration number.
      summary: Register a manual admission application
      tags:
      - Admissions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAdmissionCreateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminAdmissionCreateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminAdmissionCreateRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAdmissionCreateResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailErrorResponse'
          description: ''
  /api/admin-portal/admissions/{registration_number}/action/:
    post:
      operationId: AdminAdmissionAction
      description: Moves an application through the verification workflow ('advance')
        or rejects it ('reject'). Advancing a Fee_Pending application to Confirmed
        also generates student and parent login credentials.
      summary: Advance or reject an admission application
      parameters:
      - in: path
        name: registration_number
        schema:
          type: string
        description: Admission registration number.
        required: true
      tags:
      - Admissions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAdmissionActionRequestRequest'
            examples:
              AdmissionActionBody:
                value:
                  action: advance
                  reason: ''
                description: Move an application to its next workflow stage.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminAdmissionActionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminAdmissionActionRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAdmissionActionResponse'
              examples:
                AdmissionActionBody:
                  value:
                    action: advance
                    reason: ''
                  description: Move an application to its next workflow stage.
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
