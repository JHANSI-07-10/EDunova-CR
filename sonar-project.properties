# SonarQube Cloud configuration for EDunova-CR (School ERP)
# Docs: https://docs.sonarsource.com/sonarqube-cloud/appendices/project-information/

sonar.projectKey=edunova-cr
sonar.projectName=EduNova CR (School ERP)
sonar.organization=edunova

# --- Sources ---------------------------------------------------------------
sonar.sources=frontend/src,backend/apps,backend/portal,backend/config
sonar.tests=backend/portal/tests,frontend/tests

# --- Language hints --------------------------------------------------------
sonar.sourceEncoding=UTF-8
sonar.language=py,js,jsx

# --- Exclusions (generated / vendored / build artifacts) --------------------
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.venv/**,\
  **/venv/**,\
  **/__pycache__/**,\
  **/staticfiles/**,\
  **/media/**,\
  **/backups/**,\
  **/.freebuff/**,\
  **/test-results/**,\
  **/e2e-report/**,\
  backend/_upload_media.py

# Django migrations are mostly auto-generated; exclude from analysis to avoid
# duplication/coverage noise while still letting them be reviewed in PRs.
sonar.coverage.exclusions=\
  **/migrations/**,\
  **/*_test.py,\
  **/tests/**,\
  **/test_*.py

# Frontend: exclude build/dev artifacts and generated bundle assets.
sonar.javascript.exclusions=\
  frontend/dist/**,\
  frontend/public/**,\
  frontend/node_modules/**

# --- Test / coverage detection ---------------------------------------------
# Backend: Django test runner with pytest-cov XML report.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=pytest.xml

# --- Duplication -----------------------------------------------------------
# Reduce noise from the four role portals (admin/teacher/student/parent) that
# intentionally share the same layout skeleton.
sonar.cpd.exclusions=\
  **/migrations/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/staticfiles/**,\
  frontend/src/portals/*/components/ProtectedRoute.jsx,\
  frontend/src/portals/*/lib/api.js
