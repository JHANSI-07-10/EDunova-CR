name: CI

on:
  push:
    branches: [main, jhansi, develop]
    paths: ['backend/**', '.github/workflows/**', 'frontend/**']
  pull_request:
    paths: ['backend/**', '.github/workflows/**', 'frontend/**']

jobs:
  backend:
    name: Backend lint, checks, schema validation & tests
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-prod-0123456789012345678901234
      DEBUG: 'False'
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DB_SSL_REQUIRE: 'False'
      # The test client speaks plain HTTP; without this the TLS redirect
      # middleware turns every status assertion into a 301 and the suite fails.
      SECURE_SSL_REDIRECT: 'False'
      # Django's test client connects to the host "testserver".
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==25.0.1"
          python -m pip install --only-binary :all: -r requirements.txt "ruff==0.16.2"

      - name: Compile python sources
        run: python -m compileall -q .

      - name: Ruff lint
        run: ruff check config portal apps --output-format=github || true

      - name: Django system check
        run: python manage.py check

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate

      - name: Run tests
        run: python manage.py test --verbosity 1

      # apply_portal_schema creates tables that REFERENCE Django tables
      # (auth_user, ...). On a fresh runner the main DB is empty (tests use a
      # separate test_postgres DB), so apply migrations first.
      - name: Migrate database
        run: python manage.py migrate --noinput

      - name: Apply portal schema idempotency check
        run: python manage.py apply_portal_schema

  frontend:
    name: Frontend — production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Build
        run: npm run build