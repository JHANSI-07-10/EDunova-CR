name: CI

on:
  push:
    branches: [main, jhansi, develop]
    paths: ['backend/**', '.github/workflows/**', 'frontend/**']
  pull_request:
    paths: ['backend/**', '.github/workflows/**', 'frontend/**']

jobs:
  backend:
    name: Backend lint, checks, schema validation & tests
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-prod
      DEBUG: 'False'
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DB_SSL_REQUIRE: 'False'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        health-cmd: pg_isready -U postgres
        health-options:
          interval: 10s
          timeout: 5s
          retries: 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Compile python sources
        run: python -m compileall -q .

      - name: Ruff lint
        run: ruff check config portal apps --output-format=github || true

      - name: Django system check
        run: python manage.py check

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate

      - name: Run tests
        run: python manage.py test --verbosity 1

      - name: Apply portal schema idempotency check
        run: python manage.py apply_portal_schema

  frontend:
    name: Frontend — production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build