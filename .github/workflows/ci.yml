name: CI

on:
  push:
    branches: [main, jhansi]
  pull_request:

jobs:
  backend:
    name: Backend — check + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # SQLite stands in for Supabase in CI; the pooler/Postgres config is
      # exercised by the real deployment.
      DATABASE_URL: sqlite:///ci.sqlite3
      DB_SSL_REQUIRE: "False"
      DJANGO_SECRET_KEY: ci-only-secret-key
      ALLOWED_HOSTS: ci.example.com
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Run portal test suite
        run: python manage.py test portal

  frontend:
    name: Frontend — production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
